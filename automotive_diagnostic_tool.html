<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Automotive Diagnostic Assistant</title>
<style>
  /* Everything below sets explicit colors on every element - both text
     AND background - rather than relying on defaults. This matters more
     than it looks: without it, a colored box's background stays light
     while its text color is inherited from the page (which could be
     light-on-light in a dark browser theme), making text unreadable. */
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background:#ffffff; color:#212529;
         max-width:860px; margin:24px auto; padding:0 16px; }
  h2, h3 { color:#212529; }

  /* .box is the generic message/callout style; the 4 modifier classes
     below (success/danger/warning/neutral) recolor it for that message's
     severity - same pattern Bootstrap alerts use. */
  .box { padding:12px; border-radius:4px; margin:10px 0; border-left:6px solid #adb5bd;
         background:#f8f9fa; font-size:14px; line-height:1.5; }
  .box.success { background:#d4edda; border-color:#28a745; color:#155724; }
  .box.danger  { background:#f8d7da; border-color:#dc3545; color:#721c24; }
  .box.warning { background:#fff3cd; border-color:#e0a800; color:#664d03; }
  .box.neutral { background:#f1f3f5; border-color:#adb5bd; color:#212529; }

  .btnrow { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; align-items:center; }
  /* .btn is the base button; -info/-warning/-primary/-success recolor it
     by role (info = "run this check", warning = "start over", etc.) so
     buttons are visually distinguishable by what they do, not just by
     their text. */
  .btn { padding:9px 16px; border:none; border-radius:4px; cursor:pointer; font-size:14px;
         background:#6c757d; color:#ffffff; }
  .btn:hover { opacity:0.85; }
  .btn-info { background:#17a2b8; }
  .btn-warning { background:#ffc107; color:#212529; }
  .btn-primary { background:#0d6efd; }
  .btn-success { background:#28a745; }

  .text-input { padding:9px; border:1px solid #ced4da; border-radius:4px; font-size:14px; min-width:180px; }
  .testbox { border:1px solid #dee2e6; border-radius:4px; padding:12px; margin:10px 0; background:#ffffff; }
  .pidnote { font-size:0.85em; color:#495057; margin-top:6px; } /* the small "Live PID match: ..." line under a test */
  .search-link { display:inline-block; background:#4285f4; color:#ffffff !important; padding:9px 14px;
                 border-radius:4px; text-decoration:none; margin:8px 8px 8px 0; }

  /* Live PID Reference table: fixed max-height + scroll, since some
     vehicles have 300+ signals and the table shouldn't push the rest of
     the page off-screen. */
  .table-wrap { max-height:340px; overflow:auto; border:1px solid #dee2e6; border-radius:4px; margin-top:8px; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th, td { padding:6px 8px; text-align:left; border-bottom:1px solid #eee; }
  th { background:#f1f3f5; position:sticky; top:0; } /* header row stays visible while scrolling the table */

  .breadcrumb { font-size:0.85em; color:#6c757d; margin-bottom:6px; }
</style>
</head>
<body>
<h2>Professional Diagnostic Assistant
  <!-- This link sits OUTSIDE #screen, so clearScreen() (which only wipes
       #screen's contents) never removes it - it's always clickable, even
       mid-way through a long chain of questions, as an escape hatch back
       to the main menu. -->
  <a href="#" id="start-over-link" style="font-size:0.5em; margin-left:12px; color:#0d6efd;">Start Over</a>
</h2>
<!-- Every screen the app shows - the vehicle prompt, a question, a test
     stage, a conclusion - is rendered by clearing this single div and
     filling it with freshly created elements. There is no client-side
     routing/framework here on purpose: the whole app is small enough
     that "clear a div, build some DOM nodes, attach click handlers" is
     simpler and more transparent than pulling in a UI library. -->
<div id="screen"></div>

<script>
// ============================================================
// AUTOMOTIVE DIAGNOSTIC TOOL - single self-contained file.
//
// Everything the app needs - the trouble-code database, the decision
// tree, all styling, and all logic - lives in this one HTML file. There
// is no build step and no server: download it, open it in a browser,
// done. The only network activity is optional: if you enter a vehicle,
// the app fetches that vehicle's live sensor PID definitions from the
// OBDb project (https://github.com/OBDb) directly from your browser.
//
// Structure of this <script> block, top to bottom:
//   1. OBD_DATABASE   - static trouble-code (DTC) reference data
//   2. DIAGNOSTIC_TREE - static decision-tree data (see schema comment below)
//   3. DATA           - the app's mutable runtime state (current vehicle,
//                        currently loaded PID signals) - this is the only
//                        one of the three that changes while the app runs
//   4. Everything else - DOM helpers, the OBDb fetch, the TF-IDF symptom
//      classifier, and the render functions that turn 1-3 into screens
// ============================================================

// ============================================================
// 1. OBD_DATABASE - local trouble code (DTC) reference table
//
// Static data, independent of the OBDb live-PID data below - DTCs
// (P0300, P0420, ...) are fault-history codes; OBDb signals are live
// sensor readings, a completely different thing. Each code maps to a
// dict with a single "desc" key (description + likely causes) - kept
// intentionally flat since lookupCode() below only ever needs one string
// per code. Grouped by SAE-standardized code range purely so the ~30
// entries are scannable, not because the code cares about the grouping.
// ============================================================

const OBD_DATABASE = {
    "P0100": {"desc": "Mass or Volume Air Flow Circuit Malfunction. Likely causes: dirty/failing MAF sensor, torn intake ducting, or a wiring fault at the MAF connector."},
    "P0101": {"desc": "MAF Circuit Range/Performance Problem. Likely causes: dirty MAF element, a vacuum leak downstream of the MAF, or aftermarket intake miscalibration."},
    "P0113": {"desc": "Intake Air Temperature Sensor 1 Circuit High. Likely causes: open circuit, corroded connector, or a failed IAT sensor."},
    "P0128": {"desc": "Coolant Thermostat (temp below regulating threshold). Likely causes: thermostat stuck open, low coolant, or a faulty coolant temp sensor."},
    "P0130": {"desc": "O2 Sensor Circuit Malfunction (Bank 1, Sensor 1). Likely causes: failed upstream O2 sensor, wiring damage, or an exhaust leak near the sensor."},
    "P0171": {"desc": "System Too Lean (Bank 1). Likely causes: vacuum leak, dirty MAF sensor, weak fuel pump/clogged injectors, or an exhaust leak before the O2 sensor."},
    "P0174": {"desc": "System Too Lean (Bank 2). Likely causes: vacuum leak on bank 2, fuel delivery restriction, or a failing MAF sensor."},
    "P0175": {"desc": "System Too Rich (Bank 2). Likely causes: leaking fuel injector, failed fuel pressure regulator, or a faulty O2 sensor."},

    // --- P03xx: Ignition System / Misfire ---
    "P0300": {"desc": "Random or Multiple Cylinder Misfire Detected. Likely causes: worn spark plugs, failing ignition coil(s), a vacuum leak, or low fuel pressure."},
    "P0301": {"desc": "Cylinder 1 Misfire Detected. Likely causes: bad spark plug/coil on cylinder 1, a fuel injector fault, or low compression."},
    "P0302": {"desc": "Cylinder 2 Misfire Detected. Likely causes: bad spark plug/coil on cylinder 2, a fuel injector fault, or low compression."},
    "P0303": {"desc": "Cylinder 3 Misfire Detected. Likely causes: bad spark plug/coil on cylinder 3, a fuel injector fault, or low compression."},
    "P0304": {"desc": "Cylinder 4 Misfire Detected. Likely causes: bad spark plug/coil on cylinder 4, a fuel injector fault, or low compression."},
    "P0325": {"desc": "Knock Sensor 1 Circuit Malfunction. Likely causes: failed knock sensor, damaged wiring, or a loose sensor mount."},
    "P0335": {"desc": "Crankshaft Position Sensor Circuit Malfunction. Likely causes: failed crank sensor, a damaged reluctor ring, or a wiring fault."},
    "P0340": {"desc": "Camshaft Position Sensor Circuit Malfunction. Likely causes: failed cam sensor, timing chain/belt wear, or a wiring fault."},

    // --- P04xx: Emissions (EGR, catalyst, EVAP) ---
    "P0401": {"desc": "EGR Flow Insufficient. Likely causes: clogged EGR valve/passages, a failed EGR valve, or carbon buildup."},
    "P0420": {"desc": "Catalytic Converter Efficiency Below Threshold (Bank 1). Likely causes: deteriorated catalytic converter, a failing O2 sensor, or an exhaust leak."},
    "P0430": {"desc": "Catalytic Converter Efficiency Below Threshold (Bank 2). Likely causes: deteriorated catalytic converter, a failing O2 sensor, or an exhaust leak."},
    "P0442": {"desc": "Evaporative Emission System Leak Detected (small leak). Likely causes: loose/damaged gas cap, a cracked EVAP hose, or a faulty purge valve."},
    "P0455": {"desc": "Evaporative Emission System Leak Detected (large leak). Likely causes: gas cap left off/loose, a disconnected EVAP hose, or a failed purge/vent valve."},

    // --- P05xx: Vehicle Speed, Idle Control, Charging System ---
    "P0500": {"desc": "Vehicle Speed Sensor Malfunction. Likely causes: failed VSS, damaged wiring, or an ABS tone ring issue."},
    "P0505": {"desc": "Idle Control System Malfunction. Likely causes: faulty IAC valve, a dirty throttle body, or a vacuum leak."},
    "P0506": {"desc": "Idle RPM Lower Than Expected. Likely causes: carbon buildup in the throttle body, a vacuum leak, or a failing IAC valve."},
    "P0507": {"desc": "Idle RPM Higher Than Expected. Likely causes: vacuum leak, a stuck-open IAC valve, or throttle body carbon buildup."},
    "P0562": {"desc": "System Voltage Low. Likely causes: weak/failing battery, a failing alternator, or corroded battery terminals."},
    "P0563": {"desc": "System Voltage High. Likely causes: overcharging alternator/regulator, a bad battery cell, or a wiring fault."},

    // --- P07xx: Transmission ---
    "P0700": {"desc": "Transmission Control System Malfunction (informational - check the TCM for a specific code)."},
    "P0715": {"desc": "Input/Turbine Speed Sensor Circuit Malfunction. Likely causes: failed input speed sensor, a wiring fault, or low transmission fluid."},
    "P0720": {"desc": "Output Speed Sensor Circuit Malfunction. Likely causes: failed output speed sensor, a damaged tone ring, or a wiring fault."},
    "P0730": {"desc": "Incorrect Gear Ratio. Likely causes: low/degraded transmission fluid, worn clutch packs, or a valve body fault."},
    "P0740": {"desc": "Torque Converter Clutch Circuit Malfunction. Likely causes: failed TCC solenoid, low transmission fluid, or a wiring fault."},
}

// ============================================================
// 2. DIAGNOSTIC_TREE - the branching question/test/conclusion data
//
// A plain nested object with exactly three node shapes, and every node
// is one of them:
//
//   1. QUESTION node: {question: "...", options: {label: child, ...}}
//      Shown as a question with one button per option; clicking a button
//      moves to that option's child node (itself one of these three
//      shapes, recursively).
//
//   2. TESTS node: {diagnosis: "...", tests: [ {test}, {test}, ... ]}
//      Marks the start of a diagnostic stage. Each {test} is:
//        {check: "short name", instruction: "what to physically do",
//         options: {label: child, ...}}
//      "check" is also fuzzy-matched against live OBDb PID data (see
//      matchPidForCheck below), so a step like "Battery Voltage" can show
//      the real PID a scan tool would use to read it.
//
//   3. LEAF (a plain string): the final diagnosis + fix, in one sentence.
//      This is the only case where a node is NOT an object. Every path
//      through the tree eventually reaches one of these, and it names
//      ONE specific cause - ambiguous "it's X or Y" endings get one more
//      test added to tell X and Y apart before concluding (see the
//      Vacuum Leak Spray Test / Coil Resistance Check / etc. below for
//      examples of that pattern).
//
// The renderNode() dispatcher further down decides which of these three
// shapes it's looking at with a simple type check (string -> leaf, has
// "tests" -> tests node, otherwise -> question node) - see that
// function's comment for the rest of this story.
//
// Sections below are commented by category/branch purely for human
// navigation of this ~800-line literal - the code doesn't care about the
// section boundaries, only about the shapes described above.
// ============================================================

const DIAGNOSTIC_TREE = {
    // ---------------------------------------------------------------
    // ENGINE
    // ---------------------------------------------------------------
    "Engine": {
        "question": "What is the primary engine symptom?",
        "options": {
            // --- Starting Issues: first fork is "does it crank at all?" ---
            "Starting Issues": {
                "question": "Does the engine crank when you turn the key?",
                "options": {
                    // -- Cranks fine, just doesn't start: split on flooding vs no-spark/no-fuel --
                    "Cranks normally, just won't start": {
                        "question": "Do you smell raw fuel, or does it backfire/sputter while cranking?",
                        "options": {
                            "Yes, floods / smells like fuel": {
                                "diagnosis": "Possible Flooding or Over-Rich Condition",
                                "tests": [{
                                    "check": "Clear-Flood Start",
                                    "instruction": "Hold the throttle fully open and crank for about 10 seconds. Does it start?",
                                    "options": {
                                        "Yes": {
                                            "diagnosis": "Flooding Source Check",
                                            "tests": [{
                                                "check": "Injector Wet-Plug Test",
                                                "instruction": "Remove the spark plug from one cylinder while the engine is still flooded. Does that plug smell heavily of raw fuel or look visibly wet?",
                                                "options": {
                                                    "Yes, wet with fuel": "Stuck-open fuel injector flooding that cylinder. Replace or professionally clean/test the injector.",
                                                    "No, dry/normal": "Over-rich cold-start enrichment, likely from a coolant temperature sensor reading colder than actual. Test the sensor against actual engine temperature and replace it if inaccurate."
                                                }
                                            }]
                                        },
                                        "No": {
                                            "diagnosis": "Fuel/Ignition Cross-Check",
                                            "tests": [{
                                                "check": "Spark Test",
                                                "instruction": "Pull a spark plug, ground it against bare metal on the block, and crank while watching for a blue spark. Do you see one?",
                                                "options": {
                                                    "No": {
                                                        "diagnosis": "Ignition Component Check",
                                                        "tests": [{
                                                            "check": "Coil Resistance Check",
                                                            "instruction": "Using a multimeter, measure the ignition coil's primary resistance and compare to spec. Is it out of spec?",
                                                            "options": {
                                                                "Yes, out of spec": "Failed ignition coil. Replace the coil.",
                                                                "No, in spec": {
                                                                    "diagnosis": "Sensor vs Module Check",
                                                                    "tests": [{
                                                                        "check": "Crank Sensor Signal Test",
                                                                        "instruction": "Using a scan tool or scope, check for a crank position sensor signal while cranking. Is a clean signal present?",
                                                                        "options": {
                                                                            "No signal": "Failed crankshaft position sensor. Replace the sensor.",
                                                                            "Signal present": "Coil and sensor both test fine, so the fault is in the ignition control module. Replace the ignition control module."
                                                                        }
                                                                    }]
                                                                }
                                                            }
                                                        }]
                                                    },
                                                    "Yes": {
                                                        "diagnosis": "Fuel Delivery Check",
                                                        "tests": [{
                                                            "check": "Regulator Vacuum Pinch Test",
                                                            "instruction": "With a fuel pressure gauge connected, briefly pinch off the vacuum line to the fuel pressure regulator while watching the gauge. Does pressure rise noticeably?",
                                                            "options": {
                                                                "Yes, pressure rises": "Fuel pressure regulator's vacuum diaphragm is leaking, letting excess fuel into the intake. Replace the fuel pressure regulator.",
                                                                "No change": "Regulator is fine, so a stuck-open fuel injector is dumping excess fuel. Replace or professionally clean/test the injector."
                                                            }
                                                        }]
                                                    }
                                                }
                                            }]
                                        }
                                    }
                                }]
                            },
                            "No unusual smell/sputter": {
                                "diagnosis": "No-Spark / No-Fuel Diagnosis",
                                "tests": [{
                                    "check": "Spark Test",
                                    "instruction": "Pull a spark plug, ground it to the block, and crank briefly. Do you see spark?",
                                    "options": {
                                        "No": {
                                            "question": "Check the crank position sensor connector and ignition coil connections for corrosion or looseness. Any visible damage?",
                                            "options": {
                                                "Yes, damaged/loose wiring": "Wiring or connector fault at the crank sensor or coil pack. Clean/reseat or repair, then retest for spark.",
                                                "No visible damage": {
                                                    "diagnosis": "Sensor vs Module Check",
                                                    "tests": [{
                                                        "check": "Crank/Cam Sensor Signal Test",
                                                        "instruction": "Using a scan tool or scope, check for a crank/cam position sensor signal while cranking. Is a clean signal present?",
                                                        "options": {
                                                            "No signal": "Failed crankshaft or camshaft position sensor (whichever the scan tool flags). Replace the faulty sensor.",
                                                            "Signal present": "Sensor signal is present but spark still isn't happening. Ignition control module fault - replace the module."
                                                        }
                                                    }]
                                                }
                                            }
                                        },
                                        "Yes": {
                                            "diagnosis": "Fuel Delivery Check",
                                            "tests": [{
                                                "check": "Fuel Pump Prime",
                                                "instruction": "Turn the key to 'ON' (not crank) and listen near the tank for the fuel pump priming hum (2-3 seconds). Do you hear it?",
                                                "options": {
                                                    "No": {
                                                        "diagnosis": "Pump Circuit Check",
                                                        "tests": [{
                                                            "check": "Fuse and Relay Swap",
                                                            "instruction": "Check the fuel pump fuse, and swap the fuel pump relay with an identical relay from elsewhere in the fuse box. Does this fix it, or does one test bad?",
                                                            "options": {
                                                                "Yes, fuse or relay bad": "Blown fuel pump fuse or a failed relay. Replace whichever tested bad.",
                                                                "No, both test fine": {
                                                                    "diagnosis": "Pump Voltage Check",
                                                                    "tests": [{
                                                                        "check": "Voltage at Pump Connector",
                                                                        "instruction": "Have someone crank the engine while you check for voltage at the fuel pump's electrical connector. Is voltage present?",
                                                                        "options": {
                                                                            "Yes, voltage present": "Fuel pump has failed internally (it has power but won't run). Replace the fuel pump.",
                                                                            "No voltage": "Wiring fault between the relay and the fuel pump. Repair or replace the damaged wiring or connector."
                                                                        }
                                                                    }]
                                                                }
                                                            }
                                                        }]
                                                    },
                                                    "Yes": {
                                                        "diagnosis": "Pressure and Timing Check",
                                                        "tests": [{
                                                            "check": "Fuel Pressure Test",
                                                            "instruction": "Connect a fuel pressure gauge to the rail and check against spec while cranking. Is pressure within spec?",
                                                            "options": {
                                                                "No, out of spec": {
                                                                    "diagnosis": "Pressure Source Check",
                                                                    "tests": [{
                                                                        "check": "Regulator Vacuum Pinch Test",
                                                                        "instruction": "Pinch off the vacuum line to the fuel pressure regulator while watching the gauge. Does pressure rise?",
                                                                        "options": {
                                                                            "Yes, pressure rises": "Fuel pressure regulator is faulty. Replace the regulator.",
                                                                            "No change": "Regulator is fine, so fuel pump output is weak. Replace the fuel pump."
                                                                        }
                                                                    }]
                                                                },
                                                                "Yes, in spec": {
                                                                    "diagnosis": "Timing Check",
                                                                    "tests": [{
                                                                        "check": "Timing Marks Check",
                                                                        "instruction": "Rotate the engine by hand (or use a timing light if it will briefly run) and check that the timing marks align correctly. Are they aligned?",
                                                                        "options": {
                                                                            "No, misaligned": "Timing belt or chain has jumped or stretched. Replace the timing belt/chain and reset timing.",
                                                                            "Yes, aligned": "Fuel and timing both check out, so suspect a failed injector driver circuit or ECU fault preventing injector pulse. Test injector pulse with a noid light and check the ECU's injector driver circuit."
                                                                        }
                                                                    }]
                                                                }
                                                            }
                                                        }]
                                                    }
                                                }
                                            }]
                                        }
                                    }
                                }]
                            }
                        }
                    },
                    // -- Cranks slow: split on whether the battery/charging side is weak --
                    "Cranks slow/labored": {
                        "question": "Turn on the headlights with the engine off. Do they dim significantly or start out dim?",
                        "options": {
                            "Yes, dim/weak": {
                                "diagnosis": "Battery/Charging Check",
                                "tests": [{
                                    "check": "Battery Voltage",
                                    "instruction": "Check battery voltage at rest (engine off, ~30 min after last run). Is it below about 12.2V?",
                                    "options": {
                                        "Below 12.2V": "Weak or discharged battery. Charge fully and load-test; replace if it won't hold a charge.",
                                        "12.2V or higher": {
                                            "question": "Inspect the battery terminals and cable ends for corrosion or looseness. Found any?",
                                            "options": {
                                                "Yes": "Corroded/loose battery connection causing voltage drop under cranking load. Clean terminals and retorque connections.",
                                                "No": "Battery voltage is fine and connections are clean, so the starter motor itself is failing internally. Bench-test or replace the starter."
                                            }
                                        }
                                    }
                                }]
                            },
                            "No, lights stay bright": {
                                "diagnosis": "Mechanical Drag Check",
                                "tests": [{
                                    "check": "Free-Turn Check",
                                    "instruction": "With the spark plugs removed, try turning the engine over by hand (a socket on the crank pulley bolt works). Does it turn freely?",
                                    "options": {
                                        "No, binds/resists": "Internal engine mechanical binding (a seized component). This is a serious internal problem - have a shop inspect further before attempting to start again.",
                                        "Yes, turns freely": "The engine itself is fine, so the drag is in the starter motor binding internally. Replace the starter motor."
                                    }
                                }]
                            }
                        }
                    },
                    // -- Rapid clicking: classic weak-battery-or-bad-relay/ground symptom --
                    "Rapid clicking, doesn't crank": {
                        "diagnosis": "Cranking Circuit Check",
                        "tests": [{
                            "check": "Battery Voltage Under Load",
                            "instruction": "Check battery voltage at the terminals while attempting to start. Does it drop below about 9-10V?",
                            "options": {
                                "Yes, drops low": "Battery too weak/sulfated to supply cranking current. Load-test and replace if it fails; check the charging system afterward.",
                                "No, holds voltage": {
                                    "question": "If safely accessible, have someone lightly tap the starter housing with a wrench while you turn the key. Does it start?",
                                    "options": {
                                        "Yes": "Worn starter motor brushes or solenoid contacts. Replace the starter motor (the solenoid is usually integrated).",
                                        "No": {
                                            "diagnosis": "Relay vs Ground Check",
                                            "tests": [{
                                                "check": "Relay Swap Test",
                                                "instruction": "Swap the starter relay with an identical one from the fuse box. Does the engine now crank normally?",
                                                "options": {
                                                    "Yes": "Failed starter relay. Replace the relay.",
                                                    "No": "Relay wasn't the issue - a bad ground strap between the engine and chassis is the cause. Clean/replace the ground strap connection."
                                                }
                                            }]
                                        }
                                    }
                                }
                            }
                        }]
                    },
                    // -- Totally silent: work from the battery posts outward to isolate a dead circuit --
                    "Nothing at all (silent)": {
                        "diagnosis": "Dead Circuit Check",
                        "tests": [{
                            "check": "Battery Terminal Voltage",
                            "instruction": "With a multimeter directly on the battery posts (not the cables), do you read close to 12V?",
                            "options": {
                                "No, near 0V": "Battery itself is dead or has an internal fault. Charge and load-test; replace if it fails.",
                                "Yes, near 12V": {
                                    "diagnosis": "Cable/Fuse vs Switch Check",
                                    "tests": [{
                                        "check": "Cable and Fuse Check",
                                        "instruction": "Check the main fuse/fusible link near the battery, and inspect the battery cable ends for corrosion or looseness. Which do you find - a corroded/loose cable, a blown fuse, or neither?",
                                        "options": {
                                            "Corroded/loose cable": "Corroded or loose battery cable connection blocking power flow. Clean the terminals and retorque the connection.",
                                            "Blown fuse": "Blown main fuse or fusible link near the battery. Replace it (and check for a short if it blows again).",
                                            "Neither - both look fine": {
                                                "question": "If it's an automatic, try starting in Park and then in Neutral. Does it start in one but not the other?",
                                                "options": {
                                                    "Yes, one but not the other": {
                                                        "diagnosis": "Linkage vs Switch Check",
                                                        "tests": [{
                                                            "check": "Linkage Adjustment Check",
                                                            "instruction": "Visually check the shift linkage between the shifter and transmission for looseness or misadjustment. Is it loose or misadjusted?",
                                                            "options": {
                                                                "Yes, loose/misadjusted": "Misadjusted shift linkage preventing the neutral safety switch from engaging correctly. Adjust the linkage.",
                                                                "No, linkage is correct": "Linkage is fine, so it's a faulty neutral safety switch. Test and replace the switch."
                                                            }
                                                        }]
                                                    },
                                                    "Doesn't start in either": {
                                                        "diagnosis": "Relay vs Switch Check",
                                                        "tests": [{
                                                            "check": "Relay and Fuse Check",
                                                            "instruction": "Check the starter relay and its fuse (swap with an identical relay if possible). Does this fix it, or does one test bad?",
                                                            "options": {
                                                                "Yes, fixed it": "Blown starter fuse or failed starter relay. Replace whichever tested bad.",
                                                                "No change": "Relay and fuse are fine but there's no continuity to start - ignition switch failure. Replace the ignition switch."
                                                            }
                                                        }]
                                                    }
                                                }
                                            }
                                        }
                                    }]
                                }
                            }
                        }]
                    }
                }
            },
            // --- Performance Issue: engine starts fine but misbehaves while running ---
            "Performance Issue": {
                "question": "When does it happen?",
                "options": {
                    // -- Hesitation: cold-only points at the coolant sensor; else air/fuel metering --
                    "Hesitation/Stumbling": {
                        "diagnosis": "Potential Fuel or Air Delivery Issue",
                        "tests": [{
                            "check": "Cold vs Warm Behavior",
                            "instruction": "Does the hesitation happen mostly when the engine is cold, or at all temperatures?",
                            "options": {
                                "Mostly when cold": {
                                    "diagnosis": "Coolant Sensor Check",
                                    "tests": [{
                                        "check": "Sensor Accuracy Check",
                                        "instruction": "Compare the coolant temperature sensor's reading (via a scan tool) to the engine's actual temperature. Does the sensor read noticeably colder than actual?",
                                        "options": {

// ============================================================
// 3. DATA - mutable runtime state
//
// Unlike OBD_DATABASE and DIAGNOSTIC_TREE above (fixed data baked into
// this file), DATA changes while the app runs: "vehicle" and
// "pid_signals" get overwritten by loadVehicle() whenever someone enters
// a make/model and the OBDb fetch succeeds. There's no default vehicle
// pre-loaded - the app always boots to the vehicle-selection screen and
// fetches live, since everything here happens in a single browser
// session with no build step to "bake in" a default anymore.
// ============================================================
let DATA = { vehicle: null, pid_signals: {}, pid_repo: null };


// Template for OBDb's raw-content URL - "{repo}" gets replaced with a
// guessed repo name like "Toyota-Camry" before fetching.
const OBDB_RAW_BASE = "https://raw.githubusercontent.com/OBDb/{repo}/main/signalsets/v3/default.json";

// ---------- tiny DOM helpers used by nearly every render function below ----------

// Safely inject arbitrary text into HTML by round-tripping it through
// the DOM's own escaping (setting textContent, then reading back
// innerHTML) rather than hand-writing a regex replace - this is the
// standard "let the browser do it" way to avoid XSS when building HTML
// strings from data (vehicle names, symptom text, etc.) that ultimately
// came from user input.
function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

// Wipes the single #screen container and returns it, ready for a render
// function to fill with new content. Called at the start of every
// "show a new screen" function below - the app has exactly one visible
// screen at a time.
function clearScreen() {
  const el = document.getElementById('screen');
  el.innerHTML = '';
  return el;
}

// Creates one of the colored callout boxes styled by the .box CSS rule
// above. `cls` is one of 'success' | 'danger' | 'warning' | 'neutral'.
function mkBox(html, cls) {
  const d = document.createElement('div');
  d.className = 'box ' + cls;
  d.innerHTML = html;
  return d;
}

// Creates a styled text <input>, optionally pre-filled with `value` -
// used for the vehicle make/model/year fields, the OBD code field, and
// the free-text symptom box.
function mkInput(placeholder, value) {
  const i = document.createElement('input');
  i.type = 'text';
  i.placeholder = placeholder;
  i.className = 'text-input';
  if (value) i.value = value;
  return i;
}


// ---------- OBDb live fetch (runs in the browser) ----------
//
// This runs live, in the browser, whenever someone enters a vehicle on
// the "Change Vehicle" screen: it guesses the OBDb repo name for that
// make/model, fetches its signalset JSON straight from GitHub, and
// parses it into the flat {signal_id: {...}} shape matchPidForCheck
// expects. It only works when this page is served over http/https (e.g.
// GitHub Pages), because browsers block fetch() calls from a page opened
// directly as a local file - opening this file with a double-click still
// works for everything else, just not this.

// Try one candidate repo name. Returns the parsed signalset JSON if that
// repo exists, or null if the repo doesn't exist (a 404 - a completely
// normal/expected outcome while guessing names, not an error). Throws
// for anything else (a real network problem), which the caller uses to
// decide whether to keep guessing or give up.
async function tryFetchRepo(repo) {
  const res = await fetch(OBDB_RAW_BASE.replace('{repo}', repo));
  if (res.status === 404) return null;
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return await res.json();
}

// Flattens one OBDb signalset JSON payload into {signal_id: {name, unit,
// header, pid}}. The raw format nests signals inside "commands" (one
// command = one OBD-II request, identified by a CAN header + PID, that
// can return several signals in a single response); this un-nests that
// structure since the app only ever needs "given a signal, what PID
// reads it," not which signals share a single request.
function parseSignalset(json) {
  const signals = {};
  (json.commands || []).forEach(cmd => {
    (cmd.signals || []).forEach(sig => {
      signals[sig.id] = {
        name: sig.name || sig.id,
        unit: (sig.fmt || {}).unit || '',
        header: cmd.hdr || '?',
        pid: cmd.cmd || {}
      };
    });
  });
  return signals;
}

// Given a make/model typed into the "Change Vehicle" screen, guesses at
// the OBDb repo name ("Make-Model", then "Make-Mo-del" with a hyphen
// inserted before a trailing model number, then the bare "Make"
// fallback), trying each until one exists.
//
// Returns {signals, repo} on success, or {signals: null, repo: null} if
// every candidate came back as a clean 404 (this vehicle just isn't in
// OBDb yet). Throws an Error if EVERY candidate failed due to a real
// network problem rather than a 404 - the caller uses this distinction
// to show "not found" versus "couldn't reach GitHub" as different
// messages (see loadVehicle below).
async function fetchObdbSignalset(make, model) {
  make = make.trim(); model = model.trim();
  const candidates = [];
  if (model) {
    candidates.push(`${make}-${model}`.replace(/\s+/g, '-'));
    candidates.push(`${make}-${model.replace(/([A-Za-z])(\d)/g, '$1-$2')}`.replace(/\s+/g, '-'));
  }
  candidates.push(make.replace(/\s+/g, '-'));

  let sawNetworkError = false;
  // new Set(...) de-duplicates candidates that came out identical (e.g.
  // the two model-based guesses collapse to the same string when the
  // model name has no letter-then-digit boundary to hyphenate).
  for (const repo of [...new Set(candidates)]) {
    try {
      const json = await tryFetchRepo(repo);
      if (json) return { signals: parseSignalset(json), repo };
    } catch (e) {
      sawNetworkError = true; // keep trying the remaining candidates - one bad name doesn't mean the network is down
    }
  }
  if (sawNetworkError) throw new Error('network');
  return { signals: null, repo: null };
}

// ---------- PID matching for test steps ----------
//
// This pairs a decision-tree test's "check" label (a short phrase like
// "Battery Voltage") with the closest-matching live PID signal name from
// OBDb (e.g. "Battery voltage") using simple word-overlap similarity -
// no external library, just set intersection. This is intentionally a
// simple heuristic, not a claim of true semantic matching: it can
// produce a loose match when two unrelated checks share one generic word
// (documented in the README's "Known limitations" section).

// Word-overlap similarity between two short phrases: the fraction of
// words they have in common, relative to the longer phrase's word count.
// Returns a value from 0 (no shared words) to 1 (identical word sets).
function similarity(a, b) {
  const wa = new Set(a.toLowerCase().split(/\W+/).filter(Boolean));
  const wb = new Set(b.toLowerCase().split(/\W+/).filter(Boolean));
  if (wa.size === 0 || wb.size === 0) return 0;
  let common = 0;
  wa.forEach(w => { if (wb.has(w)) common++; });
  return common / Math.max(wa.size, wb.size);
}

// For a given test's "check" text, finds the best-matching PID signal
// (if any) in the currently loaded vehicle's data and returns a ready-
// to-display HTML string describing it, or null if nothing scores above
// the 0.34 similarity cutoff (chosen empirically - low enough to catch
// real matches like "Battery Voltage" <-> "Battery voltage", high enough
// to filter out most one-word coincidental overlaps).
function matchPidForCheck(checkText) {
  const signals = DATA.pid_signals || {};
  const ids = Object.keys(signals);
  if (ids.length === 0) return null;
  let best = null, bestScore = 0;
  ids.forEach(id => {
    const score = similarity(checkText, signals[id].name);
    if (score > bestScore) { bestScore = score; best = id; }
  });
  if (bestScore < 0.34) return null;
  const info = signals[best];
  return `Live PID match: <b>${escapeHtml(info.name)}</b> - cmd ${escapeHtml(JSON.stringify(info.pid))} @ header ${escapeHtml(info.header)} (${escapeHtml(info.unit)})`;
}

// Handles the "Load Vehicle" button: stores the typed make/model/year,
// shows a "looking up..." message immediately (fetching can take a
// second or two), then attempts the live OBDb fetch and routes to one of
// three outcomes on the main screen: found signals, no repo for this
// vehicle, or a network problem. Every one of those three paths ends by
// calling showInitialPrompt(), so the user always lands somewhere useful
// regardless of what happened - there's no "silent failure" state.
async function loadVehicle(make, model, year) {
  DATA.vehicle = { make: (make || '').trim(), model: (model || '').trim(), year: (year || '').trim() };
  const el = clearScreen();
  el.appendChild(mkBox(`Looking up OBDb data for ${escapeHtml(DATA.vehicle.year)} ${escapeHtml(DATA.vehicle.make)} ${escapeHtml(DATA.vehicle.model)}...`, 'neutral'));

  try {
    const { signals, repo } = await fetchObdbSignalset(DATA.vehicle.make, DATA.vehicle.model);
    DATA.pid_signals = signals || {};
    DATA.pid_repo = repo;
    if (signals) {
      showInitialPrompt(`Loaded ${Object.keys(signals).length} live PID signals from OBDb repo <b>${escapeHtml(repo)}</b>.`, 'success');
    } else {
      showInitialPrompt(`No OBDb repository found for '<b>${escapeHtml(DATA.vehicle.make)} ${escapeHtml(DATA.vehicle.model)}</b>' - continuing without live PID data.`, 'warning');
    }
  } catch (e) {
    // fetchObdbSignalset only throws for a genuine network problem (see
    // its docstring above), so this branch specifically means "couldn't
    // reach GitHub at all" - most commonly because the page was opened
    // as a local file rather than served over http/https.
    DATA.pid_signals = {};
    DATA.pid_repo = null;
    showInitialPrompt(`Couldn't reach GitHub to fetch live PID data. If you opened this file directly (file://), browsers block that - try hosting it (e.g. GitHub Pages) instead. Continuing without live PID data.`, 'warning');
  }
}

function lookupCode(rawCode) {

    renderSymptomPromptInto(el);
  }
}

// ---------- free-text symptom description: TF-IDF + cosine-similarity classifier ----------
//
// Each category below is backed by a small set of example phrases (its
// "training documents"). On analysis, the same TF-IDF vectorization is
// applied to the user's text and every category, then ranked by cosine
// similarity - genuine vector-space text classification, not a
// does-the-string-contain-this-substring check. See README for a fuller
// explanation.
//
// "path" is the sequence of DIAGNOSTIC_TREE keys that leads to that
// category's entry point - see walkTree() below for how it's followed.

const SYMPTOM_CATEGORIES = [
  { label: "Won't Start (engine cranks)", path: ["Engine", "Starting Issues", "Cranks normally, just won't start"],
    examples: ["the engine cranks but won't start", "it turns over but never starts", "starter spins fine but the engine won't fire", "cranks strong yet doesn't start", "engine turns over normally but refuses to start", "won't start even though it cranks"] },
  { label: "Slow/Labored Cranking", path: ["Engine", "Starting Issues", "Cranks slow/labored"],

  { label: "Rapid Clicking, No Crank", path: ["Engine", "Starting Issues", "Rapid clicking, doesn't crank"],
    examples: ["rapid clicking noise when turning the key", "just clicks repeatedly and won't crank", "hear fast clicking under the hood when starting", "key turns but only clicking happens", "rapid click click click no crank at all"] },
  { label: "Completely Dead / No Response", path: ["Engine", "Starting Issues", "Nothing at all (silent)"],
    examples: ["completely dead nothing happens when i turn the key", "totally silent no response at all", "no lights no sound nothing when starting", "dashboard completely dark and unresponsive", "car is entirely dead"] },
  { label: "Hesitation or Stumbling", path: ["Engine", "Performance Issue", "Hesitation/Stumbling"],
    examples: ["car hesitates and stumbles when accelerating", "engine bogs down under acceleration", "sputters and loses power when i press the gas", "lacks power and stumbles going uphill", "jerky hesitation when speeding up", "car stalls momentarily then continues"] },
  { label: "Overheating", path: ["Engine", "Performance Issue", "Overheating"],
    examples: ["engine is overheating", "temperature gauge climbs into the red", "steam coming from under the hood", "coolant is boiling over", "running really hot on the highway", "temp light comes on after driving a while"] },
  { label: "Rough Idle / Misfire", path: ["Engine", "Performance Issue", "Rough idle or misfire feeling"],
    examples: ["rough idle at stop lights", "engine shakes and misfires at idle", "jerking sensation while idling", "check engine light flashing with rough running", "sputtering idle feels uneven", "misfire feeling under light acceleration"] },
  { label: "Vibration at Speed", path: ["Engine", "Performance Issue", "Vibration at speed"],
    examples: ["vibration that gets worse at highway speed", "steering wheel shakes at speed", "shimmy and wobble over 50 mph", "car vibrates a lot on the freeway", "shaking through the seat at higher speeds"] },
  { label: "Spongy or Soft Brake Pedal", path: ["Brakes & Steering", "Brake Pedal", "Spongy/Soft"],
    examples: ["brake pedal feels spongy and soft", "mushy brake pedal that sinks slightly", "pedal feels squishy when braking", "soft brakes need more pressure than usual", "air feels like its in the brake lines"] },
  { label: "Brake Pedal Pulsates/Shakes", path: ["Brakes & Steering", "Brake Pedal", "Pulsating/Shaking"],
    examples: ["brake pedal pulsates when stopping", "steering shakes when i brake at speed", "pedal pulses and shudders during braking", "warped rotors causing brake vibration", "shaking sensation only when braking hard"] },
  { label: "Brake Pedal Goes to the Floor", path: ["Brakes & Steering", "Brake Pedal", "Goes to the floor"],
    examples: ["brake pedal goes all the way to the floor", "pedal sinks to the floor when i hold it", "lost my brakes and pedal hit the floor", "brakes failed and pedal went down completely", "no resistance pedal drops to the floorboard"] },
  { label: "Steering Heavy / Hard to Turn", path: ["Brakes & Steering", "Steering Wheel", "Heavy/Hard to turn"],
    examples: ["steering is very heavy and hard to turn", "power steering feels stiff", "hard to turn the wheel especially at low speed", "steering wheel requires a lot of effort", "no power assist steering feels heavy"] },
  { label: "Steering Pulls to One Side", path: ["Brakes & Steering", "Steering Wheel", "Pulling to one side"],
    examples: ["car pulls to the left while driving", "vehicle drifts to one side on its own", "steering pulls right constantly", "car veers to a side when i let go of the wheel", "alignment feels off pulling one direction"] },
  { label: "Exterior Light Problem", path: ["Electrical & Lights", "Exterior Lights"],
    examples: ["headlight is out", "tail light not working", "brake light bulb burned out", "turn signal doesn't light up", "one of my exterior lights stopped working"] },
  { label: "Interior Electronics Problem", path: ["Electrical & Lights", "Interior Electronics"],
    examples: ["radio won't turn on", "power windows stopped working", "dashboard lights are out", "infotainment screen is dead", "interior electronics not responding"] },
  { label: "Battery Keeps Dying", path: ["Electrical & Lights", "Battery keeps dying"],
    examples: ["battery dies overnight", "car battery keeps dying every morning", "dead battery every time i park it", "parasitic draw killing my battery", "battery drains even when the car is off"] },
];

// Words too common to be useful for distinguishing categories ("car",
// "the", "when") get filtered out before vectorizing - without this,
// every category's vector would share a big chunk of mass on words that
// carry no diagnostic signal, diluting the real distinguishing words.
const STOPWORDS = new Set(["the", "a", "an", "is", "are", "it", "to", "of", "and", "in", "on", "at",
  "this", "that", "my", "car", "i", "im", "its", "it's", "when", "does", "do", "with", "for", "has",
  "have", "from", "just", "really", "very", "seems", "seem", "feels", "feel", "get", "gets", "getting"]);

// Splits free text into lowercase word tokens, dropping punctuation and
// stopwords. This is the first step for both the category "documents"
// (SYMPTOM_CATEGORIES[i].examples) and whatever the user types - the
// SAME function is used for both, which matters: if the two used
// different tokenization rules, comparing their vectors wouldn't be
// meaningful.
function tokenize(text) {
  return (text || "").toLowerCase().split(/[^a-z0-9']+/).filter(w => w && !STOPWORDS.has(w));
}

// Term frequency: for a tokenized document, what fraction of its words
// is each distinct word? (e.g. in ["a","a","b"], "a" has tf 2/3.) This
// is the "TF" half of "TF-IDF" - see buildClassifier for the "IDF" half.
function termFreq(doc) {
  const counts = {};
  doc.forEach(w => { counts[w] = (counts[w] || 0) + 1; });
  const total = doc.length || 1;
  const tf = {};
  Object.keys(counts).forEach(w => { tf[w] = counts[w] / total; });
  return tf;
}

// Module-level cache: the classifier's vocabulary/IDF weights and each
// category's vector only need to be computed once (from the fixed
// SYMPTOM_CATEGORIES data), not recomputed on every "Analyze" click.
let _idf = null, _categoryVectors = null;

// Builds the classifier's IDF (inverse document frequency) table and
// each category's TF-IDF vector, from SYMPTOM_CATEGORIES' example
// phrases. Called lazily (see classifySymptoms) the first time
// classification is needed, then cached.
//
// IDF is what makes this "term frequency - INVERSE DOCUMENT frequency"
// rather than just term frequency: a word that shows up in most/all
// categories (like a leftover generic word) gets a LOW idf weight (close
// to log(1) after smoothing), while a word that's concentrated in only
// one or two categories gets a HIGH idf weight - so the model
// automatically learns which words are actually diagnostic, without
// anyone hand-picking them.
function buildClassifier() {
  // Each category's "document" is just all its example phrases
  // concatenated - the classifier doesn't need to know WHICH example
  // phrase most resembles the input, only how the category as a whole
  // compares.
  const docs = SYMPTOM_CATEGORIES.map(c => tokenize(c.examples.join(" ")));

  // Document frequency: for each word, how many of the 16 category
  // documents contain it at least once? (Not how many TIMES total -
  // that's term frequency, computed separately per-document above.)
  const df = {};
  docs.forEach(doc => { new Set(doc).forEach(w => { df[w] = (df[w] || 0) + 1; }); });

  const n = docs.length; // number of categories = number of "documents" in this corpus
  _idf = {};
  // Standard smoothed IDF formula: log((n+1)/(df+1)) + 1. The +1s prevent
  // divide-by-zero and guarantee every word gets a nonzero weight even
  // if it appeared in every single category.
  Object.keys(df).forEach(w => { _idf[w] = Math.log((n + 1) / (df[w] + 1)) + 1; });

  _categoryVectors = docs.map(doc => tfidfVector(doc));
}

// Converts one tokenized document into its TF-IDF vector: for each word,
// multiply how often it appears in THIS document (tf) by how
// distinctive that word is ACROSS ALL documents (idf, computed once in
// buildClassifier and reused here for both category vectors and the
// user's query vector - using the same idf values for both is what
// makes comparing them meaningful).
function tfidfVector(doc) {
  const tf = termFreq(doc);
  const vec = {};
  Object.keys(tf).forEach(w => { vec[w] = tf[w] * (_idf[w] || 0); });
  return vec;
}

// Cosine similarity between two TF-IDF vectors (stored as sparse
// {word: weight} objects, since most words appear in neither document
// being compared). Returns a value from 0 (no shared vocabulary) to 1
// (proportionally identical word usage) - this is the standard way to
// compare two "bag of words" vectors regardless of document length.
function cosineSimilarity(vecA, vecB) {
  let dot = 0, normA = 0, normB = 0;
  const keys = new Set([...Object.keys(vecA), ...Object.keys(vecB)]);
  keys.forEach(k => {
    const a = vecA[k] || 0, b = vecB[k] || 0;
    dot += a * b; normA += a * a; normB += b * b;
  });
  if (normA === 0 || normB === 0) return 0;
  return dot / (Math.sqrt(normA) * Math.sqrt(normB));
}

// Top-level classification entry point: vectorizes the user's free text
// with the SAME idf weights the categories use (see tfidfVector), scores
// it against every category by cosine similarity, and returns all 16
// categories sorted best-match-first. Lazily builds the classifier on
// first use (see the _categoryVectors cache above).
function classifySymptoms(rawText) {
  if (!_categoryVectors) buildClassifier();
  const queryVec = tfidfVector(tokenize(rawText));
  return SYMPTOM_CATEGORIES
    .map((c, i) => ({ category: c, score: cosineSimilarity(queryVec, _categoryVectors[i]) }))
    .sort((a, b) => b.score - a.score);
}

// Follows a SYMPTOM_CATEGORIES "path" array (e.g. ["Engine", "Starting
// Issues", "Cranks slow/labored"]) down into DIAGNOSTIC_TREE to find the
// node that path points at. The first step indexes straight into the
// tree's top-level category dict; every step after that goes through
// that node's "options" dict - matching the shape difference between the
// bare top-level dict and every question-node below it (see the
// DIAGNOSTIC_TREE schema comment near the top of this file).
function walkTree(path) {
  let node = DIAGNOSTIC_TREE;
  for (const key of path) {
    node = (node && node.options) ? node.options[key] : node[key];
  }
  return node;
}


// Renders the free-text input box into an existing container `el`
// (rather than clearing the screen itself) so it can be reused both as
// its own screen (renderSymptomPrompt) and appended below a "code not
// found" message (see lookupCode above).
function renderSymptomPromptInto(el) {
  const label = document.createElement('div');
  label.innerHTML = '<b>Describe the issue, in a full sentence if you can:</b>';
  el.appendChild(label);

  const input = mkInput('e.g., the engine hesitates and stumbles when I accelerate');
  input.style.width = '70%';
  el.appendChild(input);

  const btn = document.createElement('button');
  btn.className = 'btn btn-primary';
  btn.textContent = 'Analyze';
  btn.addEventListener('click', () => analyzeSymptoms(input.value));
  el.appendChild(btn);

  input.addEventListener('keydown', e => { if (e.key === 'Enter') analyzeSymptoms(input.value); });
  input.focus();
}

function renderSymptomPrompt() {
  renderSymptomPromptInto(clearScreen());
}

const MIN_CONFIDENT_SCORE = 0.03; // below this, treat as "no real lexical match" rather than force a guess
const TOP_N_MATCHES = 3;          // how many ranked candidates to show the user

// Runs the classifier on what the user typed and decides what to show
// next: if nothing scored above the confidence floor (e.g. gibberish, or
// a symptom genuinely outside the 16 known categories), fall back to
// letting the user browse DIAGNOSTIC_TREE by category instead of forcing
// a bad guess; otherwise show the ranked candidates for the user to pick
// from (see renderSymptomMatches).
function analyzeSymptoms(rawText) {
  const ranked = classifySymptoms(rawText);
  const top = ranked.slice(0, TOP_N_MATCHES).filter(r => r.score > MIN_CONFIDENT_SCORE);

  if (top.length === 0) {
    renderNode(DIAGNOSTIC_TREE); // no confident match - fall back to manual category browse
    return;
  }
  renderSymptomMatches(rawText, top);
}

// Displays the classifier's top candidates as clickable cards, each with
// a normalized confidence bar. "Normalized" means the displayed
// percentages are the top few scores rescaled to sum to 100% for
// readability (e.g. raw cosine scores of 0.31/0.11/0.06 become a much
// more intuitive-looking 65%/23%/12%) - this is a display choice, not a
// claim that the underlying scores are true probabilities. Clicking a
// candidate jumps straight into that category's branch of the tree via
// walkTree(); "None of these" drops back to full manual browsing.
function renderSymptomMatches(rawText, top) {
  const el = clearScreen();
  el.appendChild(mkBox(`Based on "<i>${escapeHtml(rawText)}</i>", here's what this looks most like (ranked by text similarity to known symptom patterns):`, 'neutral'));

  const totalScore = top.reduce((sum, r) => sum + r.score, 0);
  top.forEach(r => {
    const pct = Math.round((r.score / totalScore) * 100);
    const row = document.createElement('div');
    row.className = 'testbox';
    row.innerHTML = `<b>${escapeHtml(r.category.label)}</b> - ${pct}% confidence
      <div style="background:#e9ecef; border-radius:3px; height:8px; margin-top:6px;">
        <div style="background:#0d6efd; width:${pct}%; height:100%; border-radius:3px;"></div>
      </div>`;
    const btn = document.createElement('button');
    btn.className = 'btn btn-primary';
    btn.textContent = 'This one';
    btn.style.marginTop = '8px';
    btn.addEventListener('click', () => renderNode(walkTree(r.category.path)));
    row.appendChild(btn);
    el.appendChild(row);
  });

  const manualBtn = document.createElement('button');
  manualBtn.className = 'btn';
  manualBtn.textContent = 'None of these - browse manually';
  manualBtn.addEventListener('click', () => renderNode(DIAGNOSTIC_TREE));
  el.appendChild(manualBtn);
}


// ---------- unified tree dispatcher (question / tests / conclusion) ----------
//
// This is the single entry point for walking DIAGNOSTIC_TREE. Every
// button anywhere in the tree UI - a question's option, a test's
// pass/fail choice, "This one" on a symptom match - calls renderNode()
// with whatever node that choice leads to, rather than each caller
// deciding for itself how to display it. That matters because a tree
// node can be any of three different shapes (see the schema comment
// above DIAGNOSTIC_TREE), and an earlier version of this app got that
// wrong: it had TWO separate rendering paths (one for question nodes,
// one for test nodes) that had each grown their own click handlers, and
// one of those handlers didn't check whether it had reached a plain
// string leaf before treating it like a dict - which crashed the moment
// a test's answer was a final diagnosis instead of another question.
// Funneling every transition through this one dispatcher, which always
// checks the node's type FIRST, makes that entire class of bug
// impossible: nothing downstream of here ever touches a node without
// knowing what shape it is.

function renderNode(node) {
  if (typeof node === 'string') { renderConclusion(node); return; }
  if (node.tests) { renderTests(node); return; }
  renderQuestion(node);
}

// Renders a question node: the question text plus one button per option.
// `node.options || node` handles the one asymmetry in the tree shape -
// DIAGNOSTIC_TREE's top-level object (the category picker) has no
// "options" wrapper around its entries, while every question node below
// it does; this lets the exact same function render both without a
// special case at the call site.
function renderQuestion(node) {
  const el = clearScreen();
  el.appendChild(mkBox(`<b>${escapeHtml(node.question || 'Select an option:')}</b>`, 'neutral'));

  const row = document.createElement('div');
  row.className = 'btnrow';
  const options = node.options || node;
  Object.entries(options).forEach(([opt, child]) => {
    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.textContent = opt;
    btn.addEventListener('click', () => renderNode(child));
    row.appendChild(btn);
  });
  el.appendChild(row);
}

// Renders a "tests" node: the diagnosis-stage title, then one box per
// test in node.tests, each showing its instruction (plus a live PID
// match if matchPidForCheck finds one - see that function's comment
// above) and a button per possible test outcome. Clicking an outcome
// button calls renderNode() with whatever that outcome maps to - a
// string (done, show the conclusion), another question, or even another
// tests node for a further round of checks - so test chains of arbitrary
// depth "just work" without this function needing to know how deep it
// is in the tree.
function renderTests(node) {
  const el = clearScreen();
  const title = document.createElement('h3');
  title.style.color = '#0d6efd';
  title.textContent = 'Diagnosis Stage: ' + (node.diagnosis || 'Step');
  el.appendChild(title);

  node.tests.forEach(test => {
    const box = document.createElement('div');
    box.className = 'testbox';
    const pidNote = matchPidForCheck(test.check);
    box.innerHTML = `<b>${escapeHtml(test.check)}</b>: ${escapeHtml(test.instruction)}` +
      (pidNote ? `<div class="pidnote">${pidNote}</div>` : '');

    const row = document.createElement('div');
    row.className = 'btnrow';
    Object.entries(test.options).forEach(([opt, result]) => {
      const btn = document.createElement('button');
      btn.className = 'btn btn-info';
      btn.textContent = opt;
      btn.addEventListener('click', () => renderNode(result));
      row.appendChild(btn);
    });
    box.appendChild(row);
    el.appendChild(box);
  });
}

// Renders a leaf (string) node: the final diagnosis + fix, styled as a
// success box, plus the shared search-link/restart controls.
function renderConclusion(text) {
  const el = clearScreen();
  el.appendChild(mkBox(escapeHtml(text), 'success'));
  appendSearchHelper(el, text);
}

// ---------- boot ----------
//
// Entry point, called once at the bottom of this script. Wires up the
// always-visible "Start Over" link (see the HTML comment near <h2> above
// ---------- boot ----------
//
// Entry point, called once at the bottom of this script. Wires up the
// always-visible "Start Over" link (see the HTML comment near <h2> above
// for why it lives outside #screen), then shows the vehicle-selection
// screen first. There's no pre-baked default vehicle to check for in
// this single-file version - DATA.vehicle always starts null - so this
// always goes to showVehiclePrompt(); "Skip for now" on that screen gets
// straight to the main hub without one.

function boot() {
  document.getElementById('start-over-link').addEventListener('click', e => {
    e.preventDefault();
    showInitialPrompt();
  });
  showVehiclePrompt();
}
boot();
</script>
</body>
</html>
